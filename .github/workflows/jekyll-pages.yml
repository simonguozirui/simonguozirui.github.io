# Build with YOUR Gemfile (Jekyll 4 + Dart Sass). Do NOT use GitHub's suggested
# "Jekyll" workflow that runs actions/jekyll-build-pages@v1 — that uses Jekyll 3.10
# + legacy sass and WILL FAIL on this repo's SCSS (@use, color.adjust, math.div).
#
# Setup once:
# 1. Settings → Pages → Build: GitHub Actions
# 2. When GitHub asks which workflow, pick THIS file: "Deploy Jekyll site to Pages"
#    (not "jekyll", "Jekyll using Docker", or anything using jekyll-build-pages)
# 3. If a wrong workflow was added, delete `.github/workflows/jekyll*.yml` templates
#    from the repo and re-select this workflow under Pages.
#
# https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site#publishing-with-a-custom-github-actions-workflow

name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - main
      - design_22
      # - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
